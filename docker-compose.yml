services:
  receipt-scanner:
    build:
      context: .
    init: true
    restart: unless-stopped
    environment:
      DISPLAY: ":99"
      TZ: "Europe/Kyiv"
      RS_DATABASE_URL: "sqlite:////app/data/receipts.db"
      RS_BASE_URL: "${RS_BASE_URL:-http://localhost:8001}"
      # Keep this value stable after the first launch: changing it invalidates
      # encrypted store credentials already saved in receipts.db.
      RS_SECRET_KEY: "${RS_SECRET_KEY:-CHANGE_ME_dev_only_insecure_key_______________=}"
    volumes:
      - ./backend/data:/app/data
    ports:
      - "8001:8001"
    shm_size: "512mb"
    # Fall back to public resolvers if the Docker embedded DNS (127.0.0.11)
    # or the host's own resolver flaps — this container makes dozens of
    # outbound calls to store/provider domains on every scheduled collection,
    # and a single resolver hiccup was taking every account down at once.
    dns:
      - 1.1.1.1
      - 8.8.8.8
